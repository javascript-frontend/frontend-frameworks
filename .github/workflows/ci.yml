name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify dataset and CLIs
        run: |
          python3 framework_advisor.py --verify-sync
          python3 framework_advisor.py --use-case saas-dashboard --seo-critical
          node src/advisor.ts --use-case saas-dashboard --seo-critical
          node src/advisor.ts --compare react vue svelte angular
